<!DOCTYPE html>
<html lang="pt-BR">
<head> 
    <meta charset="UTF-8">
    <title>Task Master - MVVM Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="src/View/estilo.css"> </head>
<body class="flex items-center justify-center text-gray-800 font-['Segoe UI', Tahoma, Geneva, Verdana, sans-serif] bg-gray-100 h-screen">
    <div id="app" class="bg-white p-6 rounded shadow-md w-full max-w-lg mx-auto">
        <h1 class="text-xl font-bold text-center border-b-2 border-gray-200 pb-2">Task Master (MVVM)</h1>
        <form action="" id="taskForm" class="flex flex-wrap items-center justify-center border-b-2 border-gray-200 gap-2 mt-5 mb-4 pb-4">
            <input type="text" id="taskTitle" name="title" placeholder="O titulo" autocomplete="off" class="flex border border-gray-300 w-55 p-2 rounded">
            <input type="text" id="descricao" name="descricao" placeholder="Qual a descrição" autocomplete="off" class="flex border border-gray-300 w-55 p-2 rounded">
            <input type="date" id="dataVenc" name="dataVenc" placeholder="Data de vencimento" autocomplete="off" class="flex border border-gray-300 w-55 p-2 rounded">
            <input type="text" id="responsavel" name="responsavel" placeholder="Quem é o responsavel" autocomplete="off" class="flex border border-gray-300 w-55 p-2 rounded">
            <button id="addBtn" class="bg-blue-700 hover:bg-blue-800 hover:shadow-lg hover:cursor-pointer text-white py-2 px-4 w-45 rounded">Adicionar</button>
        </form>
        <ul id="taskList" class="divide-y divide-gray-200"></ul>
    </div>
    <script src="src/js/TaskViewModel.js"></script>
</body>
</html>
